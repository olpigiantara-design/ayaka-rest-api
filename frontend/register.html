<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Register — AYAKA REST API</title>
<!-- TANPA GARIS MIRING -->
<link rel="stylesheet" href="css/style.css?v=11">
<link rel="stylesheet" href="css/auth.css?v=11">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="logo">
      <div class="logo-badge">AY</div>
      <span>AYAKA REST API</span>
    </a>
    <h1>Create Account</h1>
    <p class="sub">Start building with your personal API key.</p>
    <form id="registerForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="full_name" required minlength="2" placeholder="John Doe" autocomplete="name">
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" required minlength="3" placeholder="john_dev" pattern="[a-zA-Z0-9_.]+" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" required minlength="8" placeholder="Min. 8 characters" autocomplete="new-password">
          <button type="button" class="pw-toggle" data-target="password">👁</button>
        </div>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <div class="pw-wrap">
          <input type="password" id="confirm" required minlength="8" placeholder="Repeat password" autocomplete="new-password">
          <button type="button" class="pw-toggle" data-target="confirm">👁</button>
        </div>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="terms" required>
        <label for="terms" style="margin:0;">I agree to Terms & Conditions and Privacy Policy</label>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="submitBtn">Create Account →</button>
    </form>
    <div class="auth-footer">
      Sudah punya akun? <a href="login.html">Login sekarang</a>
    </div>
  </div>
</div>
<div id="toast-container"></div>
<!-- TANPA GARIS MIRING -->
<script src="js/app.js?v=11"></script>
<script src="js/auth.js?v=11"></script>
</body>
</html>
