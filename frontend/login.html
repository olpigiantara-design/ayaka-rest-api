<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Login — AYAKA REST API</title>
<!-- TANPA GARIS MIRING -->
<link rel="stylesheet" href="css/style.css?v=11">
<link rel="stylesheet" href="css/auth.css?v=11">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="logo">
      <div class="logo-badge">AY</div>
      <span>AYAKA REST API</span>
    </a>
    <h1>Welcome Back</h1>
    <p class="sub">Log in to manage your API keys and analytics.</p>
    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="pw-toggle" data-target="password">👁</button>
        </div>
      </div>
      <div class="checkbox-row" style="justify-content:space-between;">
        <label style="display:flex;align-items:center;gap:6px;margin:0;">
          <input type="checkbox" id="remember" style="width:auto;"> Remember Me
        </label>
        <a href="#" id="forgotBtn" style="color:var(--blue);font-weight:600;font-size:13px;">Forgot Password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="submitBtn">Login →</button>
    </form>
    <div class="auth-footer">
      Belum punya akun? <a href="register.html">Silakan Register</a>
    </div>
  </div>
</div>
<div id="toast-container"></div>
<!-- TANPA GARIS MIRING -->
<script src="js/app.js?v=11"></script>
<script src="js/auth.js?v=11"></script>
</body>
</html>
